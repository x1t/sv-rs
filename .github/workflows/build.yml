name: build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: "0.15.2"
  ZIGBUILD_VERSION: "0.23.3"

jobs:
  # 质量门禁:格式、clippy 零警告、全量测试(golden 逐字节对齐由测试锁定)。
  quality:
    name: fmt / clippy / test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test

  # 静态发布:zig 产出 Linux musl 全静态二进制,原始二进制作为 artifact 供 release 使用。
  static:
    name: static linux/${{ matrix.arch }}
    needs: quality
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
            binary: sv-rs-linux-amd64
          - arch: arm64
            target: aarch64-unknown-linux-musl
            binary: sv-rs-linux-arm64
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@${{ env.ZIGBUILD_VERSION }}

      - name: Build static binary
        env:
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
        run: |
          set -euo pipefail
          cargo zigbuild --release --target "$TARGET"
          mkdir -p dist
          cp "target/$TARGET/release/sv-rs" "dist/$BINARY"
          file "dist/$BINARY"
          file "dist/$BINARY" | grep -F "statically linked"
          sha256sum "dist/$BINARY" > "dist/$BINARY.sha256"

      - name: Upload static artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.binary }}
          path: dist/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 14

  # 打 v* 标签时:收集两个原始静态二进制,原生 gh 挂到 GitHub Release(对齐 Go 版)。
  release:
    name: Release ${{ github.ref_name }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: static
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download static artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p release-assets/amd64 release-assets/arm64
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name sv-rs-linux-amd64 \
            --dir release-assets/amd64
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name sv-rs-linux-arm64 \
            --dir release-assets/arm64

      - name: Prepare binary assets
        run: |
          set -euo pipefail
          mkdir -p dist
          cp release-assets/amd64/sv-rs-linux-amd64 dist/sv-rs-linux-amd64
          cp release-assets/arm64/sv-rs-linux-arm64 dist/sv-rs-linux-arm64
          chmod 0755 dist/sv-rs-linux-amd64 dist/sv-rs-linux-arm64
          file dist/sv-rs-linux-amd64 dist/sv-rs-linux-arm64
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TAG" \
            --notes "sv-rs 静态 Linux 二进制(amd64 / arm64)。" \
            --latest \
            --verify-tag \
            dist/sv-rs-linux-amd64 \
            dist/sv-rs-linux-arm64
